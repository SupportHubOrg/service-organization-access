apiVersion: apps/v1
kind: Deployment
metadata:
  name: organization-access
  labels:
    app: organization-access
spec:
  replicas: 1
  selector:
    matchLabels:
      app: organization-access
  template:
    metadata:
      labels:
        app: organization-access
    spec:
      initContainers:
      - name: wait-for-mssql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z sql-server 1433; do echo "Waiting for SQL Server..."; sleep 3; done']
      - name: wait-for-keycloak
        image: busybox:1.36
        command: ['sh', '-c', 'until wget -q -O - http://keycloak.default.svc.cluster.local:9000/health/ready; do echo "Waiting for Keycloak..."; sleep 5; done;']
      containers:
      - name: organization-access
        image: your-registry.com/supporthub/organization-access:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: organization-access-config
        - secretRef:
            name: organization-access-secret
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 300
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 150
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 60